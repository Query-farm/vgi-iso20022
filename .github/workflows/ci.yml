name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Allow release.yml to run this exact suite as a gating `uses:` job before it
  # publishes anything.
  workflow_call:
    inputs:
      linux_only:
        # release / publish callers set this: the same commit already ran the
        # full matrix (macOS included) on push, and the org's macOS runner pool
        # is small, so tagged gates run Linux only.
        description: Skip the macOS legs of the test matrix.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The SQL test runner (haybarn-unittest) every SQL job installs.
  HAYBARN_VERSION: "2.0.1rc3"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: fmt · clippy · build · doc · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace --all-features

      - name: Docs (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

      - name: Build worker (release)
        run: cargo build --release --bin iso20022-worker

  integration:
    # SQL end-to-end: the SAME test/sql/*.test suite over each transport the vgi
    # extension supports; ci/run-integration.sh sets VGI_ISO20022_WORKER per transport:
    # stdio = DuckDB spawns the worker; launch = DuckDB starts it once on a unix
    # socket and pools connections; http = `iso20022-worker --http`.
    name: SQL E2E (${{ matrix.transport }}) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.linux_only && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@v7

      - name: Build worker (release)
        run: cargo build --locked --release --bin iso20022-worker

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/target/release/iso20022-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  metadata-quality:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build worker (release)
        run: cargo build --release --bin iso20022-worker

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          location: "${{ github.workspace }}/target/release/iso20022-worker"
          fail-on: info
