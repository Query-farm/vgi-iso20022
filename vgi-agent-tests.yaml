# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (agent_tasks() in crates/iso20022-worker/src/main.rs); the answers live here,
# keyed by task name, so the agent being graded never sees them (VGI416).
# vgi-lint discovers this file in the repo root. Every reference parses an
# inline message, so the suite needs no network access or data files.

tasks:
  - name: "sniff_mt_type"
    reference_sql: "SELECT iso20022.main.iso20022_mt_type('{1:F01X}{2:I103X}{4:\n:20:R\n:23B:CRED\n:32A:260101EUR1,00\n:50K:/DE89370400440532013000\nACME\n:59:/FR1420041010050500013M02606\nWIDGETS\n:71A:SHA\n-}') AS mt"
  - name: "mt103_amount_threshold"
    reference_sql: "SELECT iso20022.main.iso20022_mt103_amount('{1:F01ACMEDEFFAXXX0000000000}{2:I103DEUTDEFFXXXXN}{3:{121:e3bf1c2a-1111-4aaa-8bbb-1234567890ab}}{4:\n:20:TXN-REF-1\n:23B:CRED\n:32A:260101EUR1234,56\n:50K:/DE89370400440532013000\nACME CORP\n:59:/FR1420041010050500013M02606\nWIDGETS SARL\n:70:INVOICE 998877\n:71A:SHA\n:72:/EToE/E2E-REF-001\n-}') > 1000 AS over_1000"
  - name: "mt103_charge_bearer"
    reference_sql: "SELECT trim(iso20022.main.iso20022_mt103_field('{1:F01ACMEDEFFAXXX0000000000}{2:I103DEUTDEFFXXXXN}{3:{121:e3bf1c2a-1111-4aaa-8bbb-1234567890ab}}{4:\n:20:TXN-REF-1\n:23B:CRED\n:32A:260101EUR1234,56\n:50K:/DE89370400440532013000\nACME CORP\n:59:/FR1420041010050500013M02606\nWIDGETS SARL\n:70:INVOICE 998877\n:71A:SHA\n:72:/EToE/E2E-REF-001\n-}', '71A')) AS charges"
  - name: "validate_ok"
    reference_sql: "SELECT (iso20022.main.iso20022_validate('{1:F01X}{2:I103X}{4:\n:20:R\n:23B:CRED\n:32A:260101EUR1,00\n:50K:/DE89370400440532013000\nACME\n:59:/FR1420041010050500013M02606\nWIDGETS\n:71A:SHA\n-}')).ok AS ok"
  - name: "mt103_read_currency"
    reference_sql: "SELECT ccy FROM iso20022.main.mt103_read('{1:F01ACMEDEFFAXXX0000000000}{2:I103DEUTDEFFXXXXN}{3:{121:e3bf1c2a-1111-4aaa-8bbb-1234567890ab}}{4:\n:20:TXN-REF-1\n:23B:CRED\n:32A:260101EUR1234,56\n:50K:/DE89370400440532013000\nACME CORP\n:59:/FR1420041010050500013M02606\nWIDGETS SARL\n:70:INVOICE 998877\n:71A:SHA\n:72:/EToE/E2E-REF-001\n-}')"
  - name: "mt202_amount_check"
    reference_sql: "SELECT amount > 1000000 AS big FROM iso20022.main.mt202_read('{1:F01ACMEDEFFAXXX0000000000}{2:I202DEUTDEFFXXXXN}{4:\n:20:FI-REF-9\n:21:REL-REF-9\n:32A:260102USD5000000,00\n:52A:CHASUS33\n:58A:DEUTDEFF\n:50K:/111\nUNDERLYING DEBTOR\n:59:/222\nUNDERLYING CREDITOR\n:70:COVER FOR MT103\n-}')"
  - name: "mt940_line_count"
    reference_sql: "SELECT count(*) AS n FROM iso20022.main.mt940_lines((SELECT raw FROM iso20022.main.mt940_read('{1:F01ACMEDEFFAXXX0000000000}{2:O940DEUTDEFFXXXXN}{4:\n:20:STMT-1\n:25:DE89370400440532013000\n:28C:12345/1\n:60F:C260101EUR1000,00\n:61:2601020102C500,00NTRFNONREF//BANK-A\nEXTRA INFO\n:86:GROCERY STORE PAYMENT\n:61:2601030103D250,50NMSCCUST-REF//BANK-B\n:86:?20RENT ?30BANK ?31ACC123\n:62F:C260103EUR1249,50\n:64:C260103EUR1249,50\n-}')))"
  - name: "mt942_line_count"
    reference_sql: "SELECT count(*) AS n FROM iso20022.main.mt942_lines((SELECT raw FROM iso20022.main.mt942_read('{1:F01ACMEDEFFAXXX0000000000}{2:O942DEUTDEFFXXXXN}{4:\n:20:INTERIM-1\n:25:DE89370400440532013000\n:28C:99/1\n:34F:EURD0,00\n:34F:EURC1000,00\n:13D:2601021430+0100\n:61:2601020102C500,00NTRFNONREF//BANK-A\n:86:INCOMING\n:90D:5EUR2500,00\n:90C:3EUR1500,00\n-}')))"
  - name: "pacs008_uetr"
    reference_sql: "SELECT uetr FROM iso20022.main.pacs008_read('<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:pacs.008.001.08\"><FIToFICstmrCdtTrf><GrpHdr><MsgId>PACS-MSG-1</MsgId><CreDtTm>2026-01-01T10:00:00Z</CreDtTm><NbOfTxs>1</NbOfTxs><SttlmInf><SttlmMtd>INDA</SttlmMtd></SttlmInf></GrpHdr><CdtTrfTxInf><PmtId><InstrId>INSTR-1</InstrId><EndToEndId>E2E-REF-001</EndToEndId><UETR>e3bf1c2a-1111-4aaa-8bbb-1234567890ab</UETR></PmtId><IntrBkSttlmAmt Ccy=\"EUR\">1234.56</IntrBkSttlmAmt><IntrBkSttlmDt>2026-01-01</IntrBkSttlmDt><ChrgBr>SHAR</ChrgBr><Dbtr><Nm>ACME CORP</Nm></Dbtr><DbtrAcct><Id><IBAN>DE89370400440532013000</IBAN></Id></DbtrAcct><DbtrAgt><FinInstnId><BICFI>DEUTDEFF</BICFI></FinInstnId></DbtrAgt><Cdtr><Nm>WIDGETS SARL</Nm></Cdtr><CdtrAcct><Id><IBAN>FR1420041010050500013M02606</IBAN></Id></CdtrAcct><CdtrAgt><FinInstnId><BICFI>BNPAFRPP</BICFI></FinInstnId></CdtrAgt><Purp><Cd>GDDS</Cd></Purp><RmtInf><Ustrd>INVOICE 998877</Ustrd></RmtInf></CdtTrfTxInf></FIToFICstmrCdtTrf></Document>')"
  - name: "pacs002_orig_uetr"
    reference_sql: "SELECT orig_uetr FROM iso20022.main.pacs002_read('<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:pacs.002.001.10\"><FIToFIPmtStsRpt><GrpHdr><MsgId>STS-1</MsgId><CreDtTm>2026-01-01T11:00:00Z</CreDtTm></GrpHdr><OrgnlGrpInfAndSts><OrgnlMsgId>PACS-MSG-1</OrgnlMsgId><OrgnlMsgNmId>pacs.008.001.08</OrgnlMsgNmId></OrgnlGrpInfAndSts><TxInfAndSts><OrgnlEndToEndId>E2E-REF-001</OrgnlEndToEndId><OrgnlUETR>e3bf1c2a-1111-4aaa-8bbb-1234567890ab</OrgnlUETR><TxSts>RJCT</TxSts><StsRsnInf><Rsn><Cd>AM04</Cd></Rsn><AddtlInf>Insufficient funds</AddtlInf></StsRsnInf></TxInfAndSts></FIToFIPmtStsRpt></Document>')"
  - name: "pain001_currency"
    reference_sql: "SELECT ccy FROM iso20022.main.pain001_read('<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:pain.001.001.09\"><CstmrCdtTrfInitn><GrpHdr><MsgId>PAIN-1</MsgId><CreDtTm>2026-01-01T09:00:00Z</CreDtTm><CtrlSum>1234.56</CtrlSum><InitgPty><Nm>ACME CORP</Nm></InitgPty></GrpHdr><PmtInf><PmtInfId>PMT-1</PmtInfId><PmtMtd>TRF</PmtMtd><ReqdExctnDt><Dt>2026-01-02</Dt></ReqdExctnDt><Dbtr><Nm>ACME CORP</Nm></Dbtr><DbtrAcct><Id><IBAN>DE89370400440532013000</IBAN></Id></DbtrAcct><DbtrAgt><FinInstnId><BICFI>DEUTDEFF</BICFI></FinInstnId></DbtrAgt><CdtTrfTxInf><PmtId><EndToEndId>E2E-REF-001</EndToEndId></PmtId><Amt><InstdAmt Ccy=\"EUR\">1234.56</InstdAmt></Amt><Cdtr><Nm>WIDGETS SARL</Nm></Cdtr><CdtrAcct><Id><IBAN>FR1420041010050500013M02606</IBAN></Id></CdtrAcct><RmtInf><Ustrd>INVOICE 998877</Ustrd></RmtInf></CdtTrfTxInf></PmtInf></CstmrCdtTrfInitn></Document>')"
  - name: "camt053_booked_entries"
    reference_sql: "SELECT count(*) AS n FROM iso20022.main.camt053_entries((SELECT raw FROM iso20022.main.camt053_read('<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:camt.053.001.08\"><BkToCstmrStmt><GrpHdr><MsgId>CAMT053-1</MsgId><CreDtTm>2026-01-03T06:00:00Z</CreDtTm></GrpHdr><Stmt><Id>STMT-1</Id><ElctrncSeqNb>5</ElctrncSeqNb><Acct><Id><IBAN>DE89370400440532013000</IBAN></Id><Ccy>EUR</Ccy><Ownr><Nm>ACME CORP</Nm></Ownr></Acct><Bal><Tp><CdOrPrtry><Cd>CLBD</Cd></CdOrPrtry></Tp><Amt Ccy=\"EUR\">1500.00</Amt><CdtDbtInd>CRDT</CdtDbtInd></Bal><Ntry><Amt Ccy=\"EUR\">500.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts><Cd>BOOK</Cd></Sts><BookgDt><Dt>2026-01-02</Dt></BookgDt><ValDt><Dt>2026-01-02</Dt></ValDt><NtryDtls><TxDtls><Refs><EndToEndId>E2E-REF-001</EndToEndId></Refs></TxDtls></NtryDtls></Ntry></Stmt></BkToCstmrStmt></Document>'))) WHERE status = 'BOOK'"
  - name: "camt054_debit_entries"
    reference_sql: "SELECT count(*) AS n FROM iso20022.main.camt054_entries((SELECT raw FROM iso20022.main.camt054_read('<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:camt.054.001.08\"><BkToCstmrDbtCdtNtfctn><GrpHdr><MsgId>CAMT054-1</MsgId><CreDtTm>2026-01-03T06:30:00Z</CreDtTm></GrpHdr><Ntfctn><Id>NTF-1</Id><Acct><Id><IBAN>DE89370400440532013000</IBAN></Id><Ccy>EUR</Ccy></Acct><Ntry><Amt Ccy=\"EUR\">250.50</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts><Cd>BOOK</Cd></Sts><NtryDtls><TxDtls><Refs><EndToEndId>E2E-DEBIT-9</EndToEndId></Refs></TxDtls></NtryDtls></Ntry></Ntfctn></BkToCstmrDbtCdtNtfctn></Document>'))) WHERE credit_debit = 'DBIT'"
  - name: "supported_messages_with_exploder"
    reference_sql: "SELECT message_type FROM iso20022.main.supported_messages WHERE exploder_function IS NOT NULL ORDER BY message_type"
